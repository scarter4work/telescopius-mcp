[project]
name = "telescopius-mcp"
version = "0.1.0"
description = "Read-only MCP server for the Telescopius astronomy planning API"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# show_framing: headed stealth Chromium (run `patchright install chromium` once).
framing = ["patchright>=1.64.1"]

[project.scripts]
telescopius-mcp = "telescopius_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telescopius_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
